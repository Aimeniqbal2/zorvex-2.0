# Zorvex ERP 2.0 — Production Container Nginx Configuration
# Listens on container port 80 (HTTP only).
# Host Nginx terminates public HTTPS on 80/443 and reverse proxies to 127.0.0.1:8081.

# ------------------------------------------------------------------------------
# Protocol & Port Preservation Maps
# Preserves incoming X-Forwarded-Proto from trusted host Nginx;
# falls back safely to $scheme for direct local curl testing.
# ------------------------------------------------------------------------------
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_port $proxy_x_forwarded_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. Public Marketing Landing Page at /
    # --------------------------------------------------------------------------
    location = / {
        root /usr/share/nginx/html/website;
        index index.html zorvex_landing.html;
        try_files /index.html /zorvex_landing.html =404;
    }

    # Marketing Landing Assets
    location /styles.css {
        root /usr/share/nginx/html/website;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /script.js {
        root /usr/share/nginx/html/website;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /images/ {
        root /usr/share/nginx/html/website;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # 2. React 2.0 SPA Application under /app/
    # --------------------------------------------------------------------------
    location = /app {
        return 301 /app/;
    }

    # PWA Service Worker (/app/sw.js and /sw.js)
    location = /app/sw.js {
        alias /usr/share/nginx/html/app/sw.js;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /sw.js {
        alias /usr/share/nginx/html/app/sw.js;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # PWA Web App Manifest (/app/manifest.webmanifest, /manifest.webmanifest, and .json fallbacks)
    location = /app/manifest.webmanifest {
        alias /usr/share/nginx/html/app/manifest.webmanifest;
        add_header Content-Type "application/manifest+json; charset=utf-8" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        alias /usr/share/nginx/html/app/manifest.webmanifest;
        add_header Content-Type "application/manifest+json; charset=utf-8" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /app/manifest.json {
        alias /usr/share/nginx/html/app/manifest.json;
        add_header Content-Type "application/manifest+json; charset=utf-8" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.json {
        alias /usr/share/nginx/html/app/manifest.json;
        add_header Content-Type "application/manifest+json; charset=utf-8" always;
        add_header Cache-Control "no-cache" always;
    }

    location /app/ {
        alias /usr/share/nginx/html/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;

        # Ensure index.html is never cached so SPA deployments load instantly
        location = /app/index.html {
            alias /usr/share/nginx/html/app/index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }

    # React compiled assets (Vite base: /app/)
    location /app/assets/ {
        alias /usr/share/nginx/html/app/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fallback for root-relative /assets/ references
    location /assets/ {
        alias /usr/share/nginx/html/app/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # 3. Django REST API Routing
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 4. Django Admin Routing
    # --------------------------------------------------------------------------
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 5. Static Files (Django Admin & DRF browsable UI)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # 6. Public Company Logos (Public branding images)
    # --------------------------------------------------------------------------
    location /media/company_logos/ {
        alias /app/media/company_logos/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # 7. Protected Media Files (Internal redirect only via X-Accel-Redirect)
    # --------------------------------------------------------------------------
    location /media/ {
        internal;
        alias /app/media/;
    }
}
